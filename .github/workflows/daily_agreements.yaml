name: Daily IBKR Agreement Submission

on:
  schedule:
    - cron: '0 11 * * *' # Daily 05:00 Costa Rica / 11:00 UTC.
  workflow_dispatch:
    inputs:
      master_account:
        description: IBKR master account for daily PDF preload
        type: choice
        options: [I6413690, F10740574]
        default: I6413690

permissions:
  contents: read

concurrency:
  group: daily-ibkr-agreements
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGM_API_EMAIL: ${{ secrets.AGM_API_EMAIL }}
      AGM_API_PASSWORD: ${{ secrets.AGM_API_PASSWORD }}
      AGREEMENT_MASTER: ${{ github.event_name == 'workflow_dispatch' && inputs.master_account || 'I6413690' }}
    outputs:
      summary: ${{ steps.publish.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and submit agreements
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/daily-agreements-summary.txt"
          printf 'Submission failed before producing a result. Broker acceptance is unconfirmed.\n' > "$summary_file"
          test -n "$AGM_API_EMAIL" && test -n "$AGM_API_PASSWORD" || { echo 'AGM_API_EMAIL/AGM_API_PASSWORD secrets are missing' >&2; exit 1; }
          response=$(curl -sS --connect-timeout 10 --max-time 45 -w "\n%{http_code}" -X POST \
            -H 'Content-Type: application/json' \
            -d "$(jq -n '{email: env.AGM_API_EMAIL, password: env.AGM_API_PASSWORD}')" \
            https://api.agmtechnology.com/token)
          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          test "$http_status" = 200 || { echo "Token request failed: HTTP $http_status" >&2; exit 1; }
          access_token=$(printf '%s' "$body" | jq -er '.access_token | select(type == "string" and length > 0)')
          if ! response=$(curl -sS --connect-timeout 10 --max-time 300 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $access_token" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg master "$AGREEMENT_MASTER" '{master_account: $master}')" \
            https://api.agmtechnology.com/actions/submit_daily_agreements); then
            printf 'Submission transport failure. Broker acceptance is unknown; check before retrying.\n' > "$summary_file"
            exit 1
          fi
          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          printf '%s' "$body" > "$RUNNER_TEMP/daily-agreements-response.json"
          python3 .github/scripts/daily_agreements_summary.py \
            --body "$RUNNER_TEMP/daily-agreements-response.json" --http-status "$http_status" \
            --master "$AGREEMENT_MASTER" --summary "$summary_file" \
            --receipt "$RUNNER_TEMP/daily-agreements-receipt.json"

      - name: Publish final summary
        id: publish
        if: ${{ always() }}
        shell: bash
        run: |
          summary_file="$RUNNER_TEMP/daily-agreements-summary.txt"
          if [ -f "$summary_file" ]; then summary=$(cat "$summary_file"); else summary='Submission failed before producing a result. Broker acceptance is unconfirmed.'; fi
          delimiter="AGREEMENTS_$(python3 -c 'import uuid; print(uuid.uuid4())')"
          printf 'summary<<%s\n%s\n%s\n' "$delimiter" "$summary" "$delimiter" >> "$GITHUB_OUTPUT"
          printf '## Daily IBKR agreement submission\n\n%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain preload receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-agreements-receipt
          path: |
            ${{ runner.temp }}/daily-agreements-summary.txt
            ${{ runner.temp }}/daily-agreements-receipt.json
          retention-days: 30
          if-no-files-found: warn

  notify-success:
    needs: prepare
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily IBKR Agreements COMPLETED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            ${{ needs.prepare.outputs.summary }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Check broker acceptance before replaying a failed or interrupted submission.

  notify-failure:
    needs: prepare
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Daily IBKR Agreements FAILED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            ${{ needs.prepare.outputs.summary }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Check broker acceptance before replaying a failed or interrupted submission.

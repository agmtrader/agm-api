name: Compile Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    services:
      upload-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agm_upload_fixture
          POSTGRES_USER: upload_fixture
          POSTGRES_PASSWORD: synthetic-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upload_fixture -d agm_upload_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate application and deployment-helper syntax without writing bytecode
        run: |
          python -B - <<'PYTHON'
          import ast
          from pathlib import Path
          sources = list(Path('src').rglob('*.py'))
          sources += [Path('run.py'), Path('dev/schema_preflight.py'), Path('dev/sync_clients_job.py')]
          for source in sources:
              ast.parse(source.read_bytes(), filename=str(source))
          print(f'Validated {len(sources)} Python sources without writing bytecode')
          PYTHON
          bash -n dev/deploy_api.sh

      - name: Run remaining repository tests without saved cache or bytecode
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -p no:cacheprovider tests -q

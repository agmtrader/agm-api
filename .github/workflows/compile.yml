name: Compile Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile application and schema preflight
        run: python -m compileall -q src run.py dev/schema_preflight.py

      # Proposal eligibility regressions must pass before Cloud Build deploys this commit.
      - name: Test startup, deployment gating, reporting cache, exception privacy and proposals
        run: python -m pytest tests/test_database_startup.py tests/test_report_cache.py tests/test_exception_reporting.py tests/test_unfunded_exception_reporting.py tests/test_investment_proposals.py tests/test_position_quotes.py tests/test_ibkr_token_cache.py tests/test_authz_contract.py tests/test_contact_read_filters.py -q

      - name: Test daily agreement preparation and broker outcomes
        run: python -m pytest tests/test_daily_agreements.py tests/test_daily_agreements_workflow.py -q

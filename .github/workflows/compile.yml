name: Compile Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    services:
      upload-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agm_upload_fixture
          POSTGRES_USER: upload_fixture
          POSTGRES_PASSWORD: synthetic-fixture-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upload_fixture -d agm_upload_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile application and schema preflight
        run: python -m compileall -q src run.py dev/schema_preflight.py

      - name: Test accounting coverage, independent totals, downloads and PDF isolation
        run: python -m pytest tests/test_accounting_statements.py tests/test_reporting_statements.py tests/test_trade_confirmations.py -q

      # Proposal eligibility regressions must pass before Cloud Build deploys this commit.
      - name: Test startup, deployment gating, reporting cache, exception privacy and proposals
        env:
          AGM_UPLOAD_TEST_DATABASE_URL: postgresql+psycopg2://upload_fixture:synthetic-fixture-password@localhost:5432/agm_upload_fixture
        run: python -m pytest tests/test_database_startup.py tests/test_database_connections.py tests/test_report_cache.py tests/test_exception_reporting.py tests/test_unfunded_exception_reporting.py tests/test_unfunded_workflow.py tests/test_investment_proposals.py tests/test_position_quotes.py tests/test_ibkr_token_cache.py tests/test_authz_contract.py tests/test_contact_read_filters.py tests/test_contact_uploads.py tests/test_daily_agreements.py tests/test_daily_agreements_workflow.py -q

      - name: Test ETL publication, scheduled outcomes and screening metrics
        run: python -m pytest tests/test_scheduled_maintenance.py tests/test_scheduled_workflows.py tests/test_clients_etl_runner.py tests/test_clients_etl_summary.py -q

name: Send Unfunded Emails

on:
  schedule:
    - cron: '00 14 * * 1'   # Every Monday at 14:00 UTC (8:00 AM Costa Rica)
  workflow_dispatch:

concurrency:
  group: send-unfunded-emails
  cancel-in-progress: false

jobs:
  send-unfunded-emails:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.email-output.outputs.summary }}
      status: ${{ steps.email-output.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - name: Request token and call send unfunded emails endpoint
        shell: bash
        env:
          AGM_API_EMAIL: ${{ secrets.AGM_API_EMAIL }}
          AGM_API_PASSWORD: ${{ secrets.AGM_API_PASSWORD }}
        run: |
          output_dir="$RUNNER_TEMP/unfunded-summary"
          fatal() {
            python3 .github/scripts/unfunded_summary.py --output-dir "$output_dir" --fatal "$1"
          }
          test -n "$AGM_API_EMAIL" && test -n "$AGM_API_PASSWORD" || { fatal "AGM_API_EMAIL/AGM_API_PASSWORD secrets are missing"; exit 1; }
          if ! response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "$AGM_API_EMAIL" --arg password "$AGM_API_PASSWORD" '{email: $email, password: $password}')" \
            https://api.agmtechnology.com/token); then
            fatal "Token request transport failure"
            exit 1
          fi
          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          if [ "$http_status" != "200" ]; then
            fatal "Token request failed (HTTP $http_status)"
            exit 1
          fi
          if ! access_token=$(echo "$body" | jq -er '.access_token | select(type == "string" and length > 0)'); then
            fatal "Token response has no usable access_token"
            exit 1
          fi
          echo "::add-mask::$access_token"

          # Do not retry this request: it sends real emails and may have partly completed.
          if ! response=$(curl -sS -w "\n%{http_code}" -X GET \
            -H "Authorization: Bearer $access_token" \
            https://api.agmtechnology.com/actions/send_unfunded_emails); then
            fatal "Email batch transport failure; delivery may have partly completed"
            exit 1
          fi
          http_status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          printf '%s' "$body" > "$RUNNER_TEMP/unfunded-response.json"
          python3 .github/scripts/unfunded_summary.py \
            --body "$RUNNER_TEMP/unfunded-response.json" --http-status "$http_status" --output-dir "$output_dir"

      - name: Publish final notification summary
        id: email-output
        if: ${{ always() }}
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/unfunded-summary"
          if [ -f "$output_dir/summary.txt" ]; then
            summary=$(cat "$output_dir/summary.txt")
            status=$(cat "$output_dir/status.txt")
          else
            summary="Unfunded email workflow failed before producing a batch result. Recipient counts are unknown. Review runner/API logs before retrying."
            status=failed
            printf '## Unfunded email run\n\n%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'summary<<EOF\n%s\nEOF\nstatus=%s\n' "$summary" "$status" >> "$GITHUB_OUTPUT"

  notify-success:
    needs: send-unfunded-emails
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send completion email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ needs.send-unfunded-emails.outputs.status == 'partial' && '⚠️ Unfunded Emails COMPLETED WITH FAILURES' || '✅ Unfunded Emails Workflow SUCCEEDED' }}"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            ${{ needs.send-unfunded-emails.outputs.summary }}

            Review the full recipient details in the GitHub Actions summary:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-failure:
    needs: send-unfunded-emails
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 Unfunded Emails Workflow FAILED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            ${{ needs.send-unfunded-emails.outputs.summary }}

            Review the workflow/API logs and recipient details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

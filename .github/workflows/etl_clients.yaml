name: Clients ETL Pipeline

on:
  schedule:
    - cron: '37 13 * * *' # 7:37 AM CST / Costa Rica (UTC-6)
  workflow_dispatch:

concurrency:
  group: clients-etl-job
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.AGM_API_SERVICE_ACCOUNT_KEY }}'
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: agm-datalake
      - name: Execute clients job and wait for terminal outcome
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          execution=$(gcloud run jobs execute agm-clients-etl --project=agm-datalake --region=us-central1 --async --format='value(metadata.name)')
          test -n "$execution"
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          echo "Cloud Run execution: $execution" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 130); do
            gcloud run jobs executions describe "$execution" --project=agm-datalake --region=us-central1 --format=json > "$RUNNER_TEMP/execution.json"
            if jq -e '.status.completionTime != null' "$RUNNER_TEMP/execution.json" > /dev/null; then
              break
            fi
            sleep 30
          done
          jq -e '.status.completionTime != null' "$RUNNER_TEMP/execution.json" > /dev/null
          gcloud storage cp "gs://agm-datalake-etl-runs/runs/$execution/overview.json" "$RUNNER_TEMP/overview.json"
          jq '{status, operational_status, run_id, warnings, extract: .overview.extract.summary, backup: .overview.backup.status, transform: .overview.transform.status}' "$RUNNER_TEMP/overview.json" >> "$GITHUB_STEP_SUMMARY"
          jq -e 'any(.status.conditions[]; .type == "Completed" and .status == "True")' "$RUNNER_TEMP/execution.json" > /dev/null
          jq -e '.operational_status == "success" or .operational_status == "completed_with_accepted_coverage_gaps"' "$RUNNER_TEMP/overview.json" > /dev/null
      - name: Prepare terminal summary
        id: summary
        if: ${{ always() }}
        shell: bash
        env:
          CLIENTS_ETL_EXECUTION: ${{ steps.execute.outputs.execution }}
        run: |
          python3 .github/scripts/clients_etl_summary.py

  notify-success:
    needs: etl
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Clients ETL Pipeline SUCCEEDED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The clients job completed. Accepted account coverage gaps remain visible in the summary.

            ${{ needs.etl.outputs.summary }}
          
  notify-failure:
    needs: etl
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 Clients ETL Pipeline FAILED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The Clients ETL Pipeline failed.

            ${{ needs.etl.outputs.summary }}

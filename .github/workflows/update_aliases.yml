name: Update IBKR Account Aliases

on:
  schedule:
    - cron: '30 20 * * *'   # Every day at 2:30 PM Costa Rica time (20:30 UTC)
  workflow_dispatch:

jobs:
  update-aliases:
    runs-on: ubuntu-latest
    env:
      AGM_API_EMAIL: ${{ secrets.AGM_API_EMAIL }}
      AGM_API_PASSWORD: ${{ secrets.AGM_API_PASSWORD }}
    outputs:
      summary: ${{ steps.update.outputs.summary }}
      accounts: ${{ steps.update.outputs.summary }}
      aliases_updated: ${{ steps.update.outputs.aliases_updated }}
      errors: ${{ steps.update.outputs.errors }}
    steps:
      - name: Request token and update aliases
        id: update
        shell: bash
        env:
          AGM_API_EMAIL: ${{ secrets.AGM_API_EMAIL }}
          AGM_API_PASSWORD: ${{ secrets.AGM_API_PASSWORD }}
        run: |
            test -n "$AGM_API_EMAIL" && test -n "$AGM_API_PASSWORD" || { echo "AGM_API_EMAIL/AGM_API_PASSWORD secrets are missing" >&2; exit 1; }
            # ─────────────────────────────────────────────────────────────
            # 1. Fetch access token (same as ETL)
            response=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg email "$AGM_API_EMAIL" --arg password "$AGM_API_PASSWORD" '{email: $email, password: $password}')" \
              https://api.agmtechnology.com/token)

            http_status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_status" != "200" ]; then
              echo "Token request failed with status $http_status" >&2
              exit 1
            fi

            access_token=$(echo "$body" | jq -r '.access_token')
            if [ "$access_token" = "null" ] || [ -z "$access_token" ]; then
              echo "access_token not found in response" >&2
              exit 1
            fi

            # 2. Trigger bulk alias update endpoint for Brokerage Accounts
            response=$(curl -s -w "\n%{http_code}" -X PATCH \
              -H "Authorization: Bearer $access_token" \
              -H "Content-Type: application/json" \
              https://api.agmtechnology.com/actions/update_pending_alias)

            http_status=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            # Successful responses contain the summary at the top level;
            # aggregate failures contain it under details.
            summary_json=$(echo "$body" | jq -c '.details // .')
            updated=$(echo "$summary_json" | jq -r '.updated // 0')
            errors=$(echo "$summary_json" | jq -r '.failed // 0')
            pending=$(echo "$summary_json" | jq -r '.pending // 0')
            skipped=$(echo "$summary_json" | jq -r '.skipped // 0')

            accounts_lines=$(echo "$summary_json" | jq -r '(.accounts // [])[] | "- " + ((.old_alias // "None") + " -> " + .new_alias)')
            error_lines=$(echo "$summary_json" | jq -r '(.failed_accounts // [])[] | "- " + (.account_id // "unknown") + ": " + (.error // "Unknown error")')
            if [ -z "$accounts_lines" ]; then accounts_lines="- None"; fi
            if [ -z "$error_lines" ]; then error_lines="- None"; fi

            summary_output=$(printf "Alias update summary\nPending: %s\nAliases updated: %s\nErrors: %s\nSkipped: %s\n\nUpdated aliases:\n%s\n\nErrors:\n%s\n" \
              "$pending" "$updated" "$errors" "$skipped" "$accounts_lines" "$error_lines")

            printf "summary<<EOF\n%s\nEOF\n" "$summary_output" >> "$GITHUB_OUTPUT"
            printf "aliases_updated=%s\nerrors=%s\n" "$updated" "$errors" >> "$GITHUB_OUTPUT"
            echo "$summary_output"

            if [ "$http_status" != "200" ]; then
              echo "Bulk alias update failed with status $http_status" >&2
              exit 1
            fi

  notify-success:
    needs: update-aliases
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Alias Update Workflow SUCCEEDED"
          to: cr@agmtechnology.com,aa@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The alias update completed successfully.

            Below is the run summary:

            ${{ needs.update-aliases.outputs.summary }}
            

  notify-failure:
    needs: update-aliases
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 Alias Update Workflow FAILED"
          to: cr@agmtechnology.com,aa@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The alias update run completed with errors. The full run summary follows:

            ${{ needs.update-aliases.outputs.summary }}

name: Market Data ETL Pipeline

on:
  schedule:
    - cron: '37 13 * * *' # 7:37 AM CST / Costa Rica (UTC-6)
  workflow_dispatch:

concurrency:
  group: market-etl-job
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      summary: ${{ steps.terminal-summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.AGM_API_SERVICE_ACCOUNT_KEY }}'
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: agm-datalake
      - name: Synchronize committed market job source
        run: python3 dev/sync_market_job.py --source-ref "$GITHUB_SHA" --apply
      - name: Execute market job and wait for its terminal outcome
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          # A lost dispatch response is uncertain; never retry or fall back to HTTP.
          execution=$(gcloud run jobs execute agm-market-etl --project=agm-datalake --region=us-central1 --async --format='value(metadata.name)')
          [[ "$execution" =~ ^agm-market-etl-[a-z0-9-]+$ ]]
          echo "execution=$execution" >> "$GITHUB_OUTPUT"
          export MARKET_ETL_EXECUTION="$execution"
          for attempt in $(seq 1 130); do
            gcloud run jobs executions describe "$execution" --project=agm-datalake --region=us-central1 --format=json > "$RUNNER_TEMP/execution.json"
            if jq -e '.status.completionTime != null' "$RUNNER_TEMP/execution.json" > /dev/null; then
              break
            fi
            sleep 30
          done
          jq -e '.status.completionTime != null' "$RUNNER_TEMP/execution.json" > /dev/null
          gcloud storage cp "gs://agm-datalake-etl-runs/runs/$execution/overview.json" "$RUNNER_TEMP/overview.json"
          python3 .github/scripts/market_etl_summary.py --validate
      - name: Publish terminal summary
        id: terminal-summary
        if: ${{ always() }}
        shell: bash
        env:
          MARKET_ETL_EXECUTION: ${{ steps.execute.outputs.execution }}
        run: python3 .github/scripts/market_etl_summary.py

  notify-success:
    needs: etl
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Market Data ETL Pipeline SUCCEEDED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The Market Data ETL Pipeline completed successfully.

            ${{ needs.etl.outputs.summary }}
          
  notify-failure:
    needs: etl
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 Market Data ETL Pipeline FAILED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The Market Data ETL Pipeline failed.

            ${{ needs.etl.outputs.summary }}

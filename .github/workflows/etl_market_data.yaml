name: Market Data ETL Pipeline

on:
  schedule:
    - cron: '0 1 * * *'   # Every day at 01:00 UTC (7:00 PM the previous day in Costa Rica)
  workflow_dispatch:

jobs:
  etl:
    runs-on: ubuntu-latest
    env:
      AGM_API_EMAIL: ${{ secrets.AGM_API_EMAIL }}
      AGM_API_PASSWORD: ${{ secrets.AGM_API_PASSWORD }}
    outputs:
      summary: ${{ steps.terminal-summary.outputs.summary }}

    steps:
      - uses: actions/checkout@v4
      - name: Request token and run scheduled operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'Operation did not produce a validated result; counts unavailable.' > "$RUNNER_TEMP/scheduled-summary.txt"
          test -n "$AGM_API_EMAIL" && test -n "$AGM_API_PASSWORD"
          response=$(curl --silent --show-error --max-time 30 -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg email "$AGM_API_EMAIL" --arg password "$AGM_API_PASSWORD" '{email: $email, password: $password}')" \
            https://api.agmtechnology.com/token)
          test "$(echo "$response" | tail -n1)" = 200
          access_token=$(echo "$response" | sed '$d' | jq -er '.access_token | select(type == "string" and length > 0)')
          # One call only: an interrupted operation may have already written results.
          response=$(curl --silent --show-error --max-time 290 -w "\n%{http_code}" \
            -H "Authorization: Bearer $access_token" \
            https://api.agmtechnology.com/etl/market_data)
          http_status=$(echo "$response" | tail -n1)
          echo "$response" | sed '$d' > "$RUNNER_TEMP/scheduled-response.json"
          python3 .github/scripts/scheduled_summary.py market --body "$RUNNER_TEMP/scheduled-response.json" --http-status "$http_status"
      - name: Publish terminal summary
        id: terminal-summary
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, uuid
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'scheduled-summary.txt')
          summary = path.read_text() if path.exists() else 'Operation failed before producing a result; counts unavailable.'
          delimiter = 'SUMMARY_' + uuid.uuid4().hex
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'summary<<{delimiter}\n{summary}\n{delimiter}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary + '\n')
          PYCODE

  notify-success:
    needs: etl
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Market Data ETL Pipeline SUCCEEDED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The Market Data ETL Pipeline completed successfully.

            ${{ needs.etl.outputs.summary }}
          
  notify-failure:
    needs: etl
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚨 Market Data ETL Pipeline FAILED"
          to: cr@agmtechnology.com,as@agmtechnology.com
          from: aa@agmtechnology.com
          body: |
            The Market Data ETL Pipeline failed.

            ${{ needs.etl.outputs.summary }}

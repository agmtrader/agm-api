name: Daily Cloud Run Refresh

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 5 AM UTC (12:00 AM CST)
    
  workflow_dispatch:        # Manual trigger

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (if needed)
        uses: actions/checkout@v4

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: agm-datalake

      - name: Validate schema and refresh the current image
        run: |
          active_revision=$(gcloud run services describe agm-api \
            --project=agm-datalake --region=us-central1 \
            --format 'value(status.traffic[0].revisionName)')
          candidate_image=$(gcloud run revisions describe "$active_revision" \
            --project=agm-datalake --region=us-central1 \
            --format 'value(status.imageDigest)')
          bash dev/deploy_api.sh "$candidate_image"

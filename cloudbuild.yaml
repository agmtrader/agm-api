# Registry cache survives between ephemeral Cloud Build workers.
options:
  machineType: 'E2_HIGHCPU_8'
  logging: 'CLOUD_LOGGING_ONLY'

substitutions:
  _IMAGE_TAG: 'manual'
  _CACHE_TAG: 'buildcache'

steps:
  # Docker's CLI image has buildx but no gcloud credential helper. Pass the
  # build identity's short-lived token outside the application build context.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-ceu'
      - |
        umask 077
        gcloud auth print-access-token > /builder/home/agm-registry-token

  - name: 'docker:27.5.1-cli'
    env: ['DOCKER_CONFIG=/builder/home/agm-cache-docker']
    entrypoint: 'sh'
    args:
      - '-ceu'
      - |
        docker login -u oauth2accesstoken --password-stdin https://us-central1-docker.pkg.dev < /builder/home/agm-registry-token
        rm /builder/home/agm-registry-token
        docker buildx create --name agm-cache --driver docker-container --use
        docker buildx build --progress=plain --provenance=false \
          --cache-from=type=registry,ref=us-central1-docker.pkg.dev/agm-datalake/cloud-run-source-deploy/agm-api:${_CACHE_TAG} \
          --cache-to=type=registry,ref=us-central1-docker.pkg.dev/agm-datalake/cloud-run-source-deploy/agm-api:${_CACHE_TAG},mode=max \
          --tag=us-central1-docker.pkg.dev/agm-datalake/cloud-run-source-deploy/agm-api:${_IMAGE_TAG} \
          --push .

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - 'dev/deploy_api.sh'
      - 'us-central1-docker.pkg.dev/agm-datalake/cloud-run-source-deploy/agm-api:${_IMAGE_TAG}'
      - '${_IMAGE_TAG}'
